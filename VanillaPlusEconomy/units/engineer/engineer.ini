transportSlotsNeeded: 1

canBuild_1_name: reclaim
canBuild_1_pos: -1

canBuild_2_name: extractor
canBuild_2_pos: 3

canBuild_3_name: landFactory
canBuild_3_pos: 4

canBuild_4_name: mechFactory
