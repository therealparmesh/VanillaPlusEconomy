[core]
name: vpe_engineer
class: CustomUnitMetadata

displayText: Engineer
displayDescription: -Constructs and repairs buildings\n-Built from the Command Center\n-Can refit into Combat Eng after 2 total Extractors or Fabricators

price: 500
maxHp: 170
mass: 3000

techLevel: 1
buildSpeed: 0.002
availableInDemo: false

radius: 10
