canBuild_8_name: repairBay
canBuild_8_pos: 8

canBuild_9_name: turret
canBuild_9_pos: 3.1

canBuild_10_name: antiAirTurret
canBuild_10_pos: 3.2

canBuild_11_name: laserDefence
canBuild_11_pos: 12

canBuild_12_name: experimentalLandFactory
canBuild_12_pos: 13

canBuild_13_name: antiNukeLaucher
canBuild_13_pos: 14

[action_refitCombatEngineer]
convertTo: combatEngineer
price: 3500
text: Eng -> Combat Eng
description: Converts this Engineer into a standard Combat Engineer. Requires 2 total Extractors or Fabricators.
descriptionAddUnitStats: combatEngineer
unitShownInUI: combatEngineer
displayType: upgrade
buildSpeed: 33.3s
whenBuilding_cannotMove: true
isLocked: if numberOfUnitsInTeam(withTag='vpe_economy', lessThan=2)
isLockedMessage: Requires 2 total Extractors or Fabricators
isLockedAlt: if self.isMoving()
isLockedAltMessage: Stop moving to refit
ai_isDisabled: true
pos: 0.2
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF

[graphics]
total_frames: 1
image: engineer.png
image_wreak: engineer_dead.png
image_turret: NONE
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[turret_1]
# Nano turret must be slot 1 for builder behavior.
x: 0
y: 5
invisible: true
warmup: 30

canShoot: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[movement]
movementType: LAND
moveSpeed: 0.6
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.08

maxTurnSpeed: 1.7
turnAcceleration: 0.25

moveSlidingMode: false
moveIgnoringBody: false

[ai]
useAsBuilder: true
